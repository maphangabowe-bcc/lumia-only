<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Rounded Circle/Rect -->
  <rect width="512" height="512" rx="128" fill="url(#g)" />
  <!-- Diary Book Cover Aesthetic lines -->
  <rect x="64" y="64" width="384" height="384" rx="32" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.15" />
  <line x1="130" y1="64" x2="130" y2="448" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8" />
  
  <!-- Glowing Luminary Celestial Beacon in the center -->
  <g filter="url(#shadow)">
    <!-- Outer starry diamond -->
    <path d="M256 110 L288 224 L402 256 L288 288 L256 402 L224 288 L110 256 L224 224 Z" fill="url(#glow)" />
    <!-- Glowing core circle -->
    <circle cx="256" cy="256" r="28" fill="#ffffff" />
    <!-- Spark indicators -->
    <path d="M256 160 L256 352 M160 256 L352 256" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8" />
  </g>
</svg>
